[project]
name = "mentor"
version = "0.1.0"
description = "Desktop AI teaching assistant that overlays any application and points at where to click"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scikit-image>=0.24",
    # Upstream renamed rapidocr-onnxruntime to rapidocr at 2.0; the old name is
    # capped at Python <3.13 and will not install here. Same engine, new name.
    "rapidocr>=3.0",
    "onnxruntime>=1.19",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "structlog>=24.4",
    "psutil>=6.0",
    # No `keyboard`: it hooks every keystroke on the machine. The global
    # hotkey uses RegisterHotKey via ctypes instead. See mentor/ui/hotkey.py.
    "mss>=9.0",
    "dxcam>=0.0.5 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
    "uiautomation>=2.0.20 ; sys_platform == 'win32'",
]

[project.scripts]
mentor = "mentor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mentor"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The specification documents are prose, not source. Do not reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = [
    "ANN401",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "offline: runs with no model, no API and no live screen",
    "windows: requires Win32 APIs",
    "manual: requires a human to look at the screen (see phases.md)",
]
addopts = "-ra --strict-markers"
